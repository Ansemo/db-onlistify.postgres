version: "3.9"
services:
  app:
    image: tu_app
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      - redis
    networks:
      - appnet

  redis:
    image: redis:7
    container_name: redis
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
